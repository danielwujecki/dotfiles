---
- name: Dynv6 Hook-Skript deployen
  ansible.builtin.copy:
    src: dynv6-hook.sh
    dest: /etc/letsencrypt/dynv6-hook.sh
    owner: root
    group: root
    mode: '0700'
  tags:
    - certbot

- name: Wildcard-Zertifikat anfordern, wenn es noch nicht existiert
  ansible.builtin.command: >
    certbot certonly --non-interactive --agree-tos
    -m '{{ shilunski_de_email }}'
    -d '{{ shilunski_de_domain }}'
    -d '*.{{ shilunski_de_domain }}'
    --manual --preferred-challenges dns
    --manual-auth-hook '/etc/letsencrypt/dynv6-hook.sh auth'
    --manual-cleanup-hook '/etc/letsencrypt/dynv6-hook.sh cleanup'
  #  --deploy-hook 'docker exec shilunski-nginx nginx -s reload'
  args:
    # Ansible überspringt diesen Task, wenn das Verzeichnis bereits existiert!
    creates: "/etc/letsencrypt/live/{{ shilunski_de_domain }}/fullchain.pem"
  tags:
    - certbot

- name: Symlink für shilunski Logrotate anlegen
  ansible.builtin.file:
    src: "{{ shilunski_de_path }}/shilunski.logrotate"
    dest: /etc/logrotate.d/shilunski
    state: link
    owner: root
    group: root
  tags:
    - shilunski_logrotate

- name: Docker Image Versionen anpassen
  ansible.builtin.lineinfile:
    path: "{{ shilunski_de_path }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    owner: "{{ user_main }}"
    group: "{{ user_main }}"
    mode: '0644'
    backup: false
  loop:
    - { key: 'NGINX_TAG', value: '{{ shilunski_de_nginx }}' }
    - { key: 'POSTGRES_TAG', value: '{{ shilunski_de_postgres }}' }
    - { key: 'KEYCLOAK_TAG', value: '{{ shilunski_de_keycloak }}' }
    - { key: 'MEALIE_TAG', value: '{{ shilunski_de_mealie }}' }
  tags:
    - update
    - shilunski_update
    - shilunski_image_tags

- name: Shilunski Container aktualisieren und starten (Pull & Up)
  community.docker.docker_compose_v2:
    project_src: "{{ shilunski_de_path }}"
    state: present
    pull: always
  tags:
    - update
    - shilunski_update
    - shilunski_deploy

- name: Nicht mehr benötigte Docker Images aufräumen (Prune)
  community.docker.docker_prune:
    images: true
    images_filters:
      # true = löscht nur ungetaggte/fehlerhafte "dangling" Images (sicherer Standard)
      # false = löscht ALLE Images, die aktuell keinem laufenden Container zugeordnet sind
      dangling: true
  tags:
    - update
    - shilunski_update
    - docker_cleanup
