---
- name: Eigene SSH-Konfiguration (sshd_custom.conf) anlegen
  ansible.builtin.template:
    src: sshd_custom.conf.j2
    dest: /etc/ssh/sshd_config.d/sshd_custom.conf
    owner: root
    group: root
    mode: '0644'
  notify: SSH-Dienst neu laden
  tags:
    - ssh_config

- name: ~/.ssh Verzeichnis sicherstellen
  ansible.builtin.file:
    path: "/home/{{ common_user_main }}/.ssh"
    state: directory
    owner: "{{ common_user_main }}"
    group: "{{ common_user_main }}"
    mode: '0700'
  tags:
    - ssh_user
    - ssh_user_auth_key

- name: SSH-Authorized-Keys für main user hinterlegen
  ansible.posix.authorized_key:
    user: "{{ common_user_main }}"
    state: present
    key: "{{ common_ssh_authorized_keys }}"
  tags:
    - ssh_user
    - ssh_user_auth_key

- name: Privaten SSH-Key für main user hinterlegen
  ansible.builtin.copy:
    src: ssh_ed25519_raspberryserver
    dest: "/home/{{ common_user_main }}/.ssh/ssh_ed25519_raspberryserver"
    owner: "{{ common_user_main }}"
    group: "{{ common_user_main }}"
    mode: '0600'
    backup: false
  tags:
    - ssh_user
    - ssh_user_key

- name: Öffentlichen SSH-Key für main user hinterlegen
  ansible.builtin.copy:
    content: "{{ common_ssh_user_pub }}\n"
    dest: "/home/{{ common_user_main }}/.ssh/ssh_ed25519_raspberryserver.pub"
    owner: "{{ common_user_main }}"
    group: "{{ common_user_main }}"
    mode: '0644'
    backup: false
  tags:
    - ssh_user
    - ssh_user_key

- name: /root/.ssh Verzeichnis sicherstellen
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: '0700'
  tags:
    - ssh_root_config
    - ssh_root_key

- name: SSH-Key Config für root anlegen
  ansible.builtin.copy:
    content: |
      AddressFamily inet
      StrictHostKeyChecking accept-new
      IdentityFile ~/.ssh/ssh_ed25519_root_at_raspberryserver
    dest: /root/.ssh/config
    owner: root
    group: root
    mode: '0644'
  tags:
    - ssh_root_config

- name: Privaten SSH-Key für root anlegen
  ansible.builtin.copy:
    src: ssh_ed25519_root_at_raspberryserver
    dest: /root/.ssh/ssh_ed25519_root_at_raspberryserver
    owner: root
    group: root
    mode: '0600'
    backup: false
  tags:
    - ssh_root_key

- name: Öffentlichen SSH-Key für root anlegen
  ansible.builtin.copy:
    content: "{{ common_ssh_root_pub }}\n"
    dest: /root/.ssh/ssh_ed25519_root_at_raspberryserver.pub
    owner: root
    group: root
    mode: '0644'
    backup: false
  tags:
    - ssh_root_key
