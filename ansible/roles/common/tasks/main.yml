---
- name: Allgemeine Systemeinstellungen anwenden
  ansible.builtin.import_tasks: system.yml
  tags:
    - system

- name: Netzwerkeinstellungen konfigurieren
  ansible.builtin.import_tasks: network.yml
  tags:
    - network

- name: Speicher und Laufwerke einrichten
  ansible.builtin.import_tasks: storage.yml
  tags:
    - storage

- name: "User anlegen: {{ user_name }}"
  ansible.builtin.user:
    name: "{{ user_name }}"
    password: "{{ user_password }}"
    shell: /bin/bash
    # If true, add the user to the groups specified in groups, but don't remove from other groups
    append: true
    groups: sudo
  tags:
    - never

- name: Dotfiles aus dem Root-Repo verteilen
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: '.bash_aliases', dest: "/home/{{ target_user }}/.bash_aliases", mode: '0644' }
    - { src: '.local/bin/sraspi-backup', dest: "/usr/local/bin/sraspi-backup", mode: '0755' }
  tags:
    - never
